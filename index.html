<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pong</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      font-family: monospace;
    }
    canvas {
      border: 2px solid #fff;
      background: #000;
    }
  </style>
</head>
<body>
  <canvas id="pong" width="800" height="500"></canvas>

  <script>
    const canvas = document.getElementById("pong");
    const ctx = canvas.getContext("2d");

    const paddleWidth = 12;
    const paddleHeight = 80;
    const ballSize = 10;

    let playerScore = 0;
    let aiScore = 0;

    const player = {
      x: 20,
      y: canvas.height / 2 - paddleHeight / 2,
      speed: 7,
      dy: 0
    };

    const ai = {
      x: canvas.width - 20 - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      speed: 5
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      dx: 5,
      dy: 3
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") player.dy = -player.speed;
      if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") player.dy = player.speed;
    });

    document.addEventListener("keyup", (e) => {
      if (["ArrowUp", "ArrowDown", "w", "W", "s", "S"].includes(e.key)) player.dy = 0;
    });

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.dx = 5 * direction;
      ball.dy = (Math.random() > 0.5 ? 1 : -1) * 3;
    }

    function update() {
      // Move player paddle
      player.y += player.dy;
      player.y = Math.max(0, Math.min(canvas.height - paddleHeight, player.y));

      // Move AI paddle
      const aiCenter = ai.y + paddleHeight / 2;
      if (aiCenter < ball.y - 10) ai.y += ai.speed;
      else if (aiCenter > ball.y + 10) ai.y -= ai.speed;
      ai.y = Math.max(0, Math.min(canvas.height - paddleHeight, ai.y));

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Top & bottom wall bounce
      if (ball.y <= 0 || ball.y + ballSize >= canvas.height) {
        ball.dy *= -1;
      }

      // Player paddle collision
      if (
        ball.x <= player.x + paddleWidth &&
        ball.x + ballSize >= player.x &&
        ball.y + ballSize >= player.y &&
        ball.y <= player.y + paddleHeight
      ) {
        ball.dx = Math.abs(ball.dx) * 1.05;
        const hitPos = (ball.y + ballSize / 2 - (player.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.dy = hitPos * 6;
      }

      // AI paddle collision
      if (
        ball.x + ballSize >= ai.x &&
        ball.x <= ai.x + paddleWidth &&
        ball.y + ballSize >= ai.y &&
        ball.y <= ai.y + paddleHeight
      ) {
        ball.dx = -Math.abs(ball.dx) * 1.05;
        const hitPos = (ball.y + ballSize / 2 - (ai.y + paddleHeight / 2)) / (paddleHeight / 2);
        ball.dy = hitPos * 6;
      }

      // Scoring
      if (ball.x < 0) {
        aiScore++;
        resetBall(1);
      } else if (ball.x > canvas.width) {
        playerScore++;
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center net
      ctx.fillStyle = "#444";
      for (let i = 0; i < canvas.height; i += 25) {
        ctx.fillRect(canvas.width / 2 - 2, i, 4, 15);
      }

      // Paddles & ball
      ctx.fillStyle = "#fff";
      ctx.fillRect(player.x, player.y, paddleWidth, paddleHeight);
      ctx.fillRect(ai.x, ai.y, paddleWidth, paddleHeight);
      ctx.fillRect(ball.x, ball.y, ballSize, ballSize);

      // Scoreboard
      ctx.font = "36px monospace";
      ctx.fillText(playerScore, canvas.width / 4, 50);
      ctx.fillText(aiScore, (canvas.width * 3) / 4, 50);
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
